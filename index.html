<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f7f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1517" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Nook. Nine puzzles, no ads, no accounts.">
<title>Nook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,560;0,9..144,620;1,9..144,560&display=swap" rel="stylesheet">
<style>
/* Nook. Colours are tokens; dark mode redefines them. */
:root {
  color-scheme: light dark;
  --bg: #f4f7f7;
  --surface: #ffffff;
  --surface-2: #eef3f3;
  --ink: #15232a;
  --ink-2: #33474e;
  --muted: #5a6c73;
  --line: #d5dfe1;
  --line-strong: #aebdc1;
  --accent: #087f82;
  --accent-strong: #065b5f;
  --accent-soft: #dcf1ee;
  --on-accent: #ffffff;
  --focus: #1d63c7;
  --bad: #c0392b;
  --bad-soft: #fde6e3;
  --board: #ffffff;
  --board-edge: #34474e;
  --grid-thin: #d0dadc;
  --grid-thick: #34474e;
  --grid-wall: #17262c;
  --wall-fill: #22343a;
  --path: #24a19a;
  --path-edge: #0a5a57;
  --path-cell: #d3efeb;
  --given: #e9eff0;
  --given-ink: #24363d;
  --entered-ink: #0a7477;
  --peer: #f0f6f6;
  --same: #cbebe6;
  --gold: #f1c443;
  --gold-edge: #5f430b;
  --sun: #f3b636;
  --sun-edge: #9a6210;
  --moon: #6e62a6;
  --moon-edge: #44397a;
  --token: #ffffff;
  --token-edge: #34474e;
  --victim: #b3343f;
  --on-victim: #ffffff;
  --hatch: #8d9ca1;
  --shadow: 0 4px 16px rgb(20 35 42 / 8%);
  --c0: #f7c99c; --c1: #a8d1f2; --c2: #bfe3b4; --c3: #f6e48c; --c4: #d5c2ef; --c5: #f5b8c9;
  --c6: #a2ddd5; --c7: #e3d0b1; --c8: #c5ccd6; --c9: #f2a99a; --c10: #d3e690; --c11: #b9c4f3;
  --serif: Fraunces, "Iowan Old Style", Georgia, serif;
  --sans: "Avenir Next", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1517;
    --surface: #172124;
    --surface-2: #1f2b2f;
    --ink: #e4edef;
    --ink-2: #c0d0d4;
    --muted: #92a5ab;
    --line: #2c3a3e;
    --line-strong: #46595e;
    --accent: #3cbcb5;
    --accent-strong: #84dbd5;
    --accent-soft: #15393a;
    --on-accent: #052120;
    --focus: #7fb2ff;
    --bad: #ff8577;
    --bad-soft: #43201c;
    --board: #182326;
    --board-edge: #91a6ac;
    --grid-thin: #314247;
    --grid-thick: #aabdc2;
    --grid-wall: #e6eff1;
    --wall-fill: repeating-linear-gradient(135deg, #060b0c 0 6px, #2a383c 6px 8px);
    --path: #35b8b0;
    --path-edge: #9be3dd;
    --path-cell: #173f3d;
    --given: #22303a;
    --given-ink: #e8f0f2;
    --entered-ink: #6fd6cf;
    --peer: #1d2a2e;
    --same: #1f4a49;
    --gold: #f4cb52;
    --gold-edge: #241803;
    --sun: #f5c24f;
    --sun-edge: #ffe2a0;
    --moon: #c1b8f2;
    --moon-edge: #ece8ff;
    --token: #e8eff1;
    --token-edge: #0e1517;
    --victim: #ff7d86;
    --on-victim: #2a0508;
    --hatch: #63777d;
    --shadow: 0 4px 16px rgb(0 0 0 / 35%);
    --c0: #6e4a2a; --c1: #24496b; --c2: #2f5a2c; --c3: #6a5d1c; --c4: #4a3a72; --c5: #6d3046;
    --c6: #1f5a54; --c7: #5b4c35; --c8: #3e4652; --c9: #733a30; --c10: #4c5a1f; --c11: #343f78;
  }
}
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--sans); -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; background: none; border: 0; padding: 0; }
button:disabled { cursor: default; opacity: .42; }
:focus { outline: none; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
#app { min-height: 100dvh; }

.home, .play, .summary { width: min(1080px, 100%); margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 24px max(32px, env(safe-area-inset-bottom)); }
.eyebrow { margin: 0 0 4px; color: var(--accent-strong); font-size: 11px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
h1 { margin: 0; font: 620 clamp(40px, 7vw, 64px)/1 var(--serif); letter-spacing: -.04em; }
.lede { max-width: 34rem; margin: 10px 0 0; color: var(--muted); font-size: 16px; }
.primary { min-height: 46px; padding: 0 20px; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-weight: 700; }
.link { min-height: 44px; padding: 0 10px; color: var(--accent-strong); font-weight: 650; text-decoration: underline; text-underline-offset: 3px; }

/* Home */
.mast { padding: 4px 0 6px; }
.tonight { display: flex; width: 100%; min-height: 84px; margin-top: 18px; padding: 14px 16px; align-items: center; justify-content: space-between; gap: 12px; text-align: left; border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 14px; background: var(--accent-soft); }
.tonight .eyebrow { margin: 0; }
.tonight-copy { display: grid; gap: 2px; }
.tonight-title { font: 620 clamp(22px, 4vw, 28px)/1.1 var(--serif); letter-spacing: -.02em; }
.tonight-go { display: grid; min-height: 44px; padding: 0 18px; place-items: center; border-radius: 9px; background: var(--accent); color: var(--on-accent); font-size: 14px; font-weight: 700; white-space: nowrap; }
.shelf-block { margin-top: 24px; }
.shelf-block h2 { margin: 0 0 10px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.shelf { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tile { display: grid; grid-template-columns: 64px minmax(0, 1fr); grid-template-rows: auto auto; align-items: center; column-gap: 12px; row-gap: 2px; width: 100%; min-height: 86px; padding: 12px; text-align: left; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); transition: border-color .15s, transform .15s; }
.tile.saved { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
.art { grid-row: 1 / span 2; display: block; width: 64px; height: 48px; }
.art svg { display: block; width: 100%; height: 100%; overflow: visible; }
.tile-name { min-width: 0; font: 620 21px/1.1 var(--serif); letter-spacing: -.02em; }
.tile-sub { color: var(--muted); font-size: 12.5px; line-height: 1.3; }
.tile.saved .tile-sub { color: var(--accent-strong); font-weight: 650; }
.tile-extra { margin-left: 6px; color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.tile:active, .tonight:active { transform: translateY(1px); }
@media (hover: hover) { .tile:hover { transform: translateY(-2px); border-color: var(--line-strong); } }

/* Tile pictures */
.art .a-bg { fill: var(--board); stroke: var(--line-strong); stroke-width: 1; }
.art .a-faint { fill: var(--surface-2); }
.art .a-line { fill: none; stroke: var(--path); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.art .a-dot { fill: var(--board); stroke: var(--accent); stroke-width: 1.5; }
.art .a-num { fill: var(--ink); font: 700 9px var(--sans); text-anchor: middle; }
.art .a-accent { fill: var(--entered-ink); }
.art .a-edge { fill: none; stroke: var(--grid-thick); stroke-width: 1.6; }
.art .a-thin { fill: none; stroke: var(--grid-thin); stroke-width: .8; }
.art .a-crown { fill: var(--gold); stroke: var(--gold-edge); stroke-width: 1; stroke-linejoin: round; }
.art .a-sun { fill: var(--sun); stroke: var(--sun-edge); stroke-width: 1; }
.art .a-moon { fill: var(--moon); stroke: var(--moon-edge); stroke-width: 1; }
.art .a-sign { fill: var(--ink-2); font: 700 13px var(--sans); text-anchor: middle; }
.art .a-word { fill: var(--ink); font: 600 7.5px var(--sans); letter-spacing: .06em; }
.art .a-word.big { font: 700 11px var(--sans); }
.art .a-rail { stroke: var(--line-strong); stroke-width: 2; }
.art .a-wall { fill: var(--ink-2); }
.art .a-hatch { fill: var(--hatch); }
.art .a-victim { fill: var(--victim); }
.art .a-token { fill: var(--token); stroke: var(--token-edge); stroke-width: 1.2; }
.art .rg0, .art .pc0, .art .rm0 { fill: var(--c0); } .art .rg1, .art .pc1, .art .rm1 { fill: var(--c1); } .art .rg2, .art .pc2, .art .rm2 { fill: var(--c2); }
.art .rg3 { fill: var(--c3); } .art .rg4 { fill: var(--c4); }

/* Game page */
.bar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; }
.back { display: inline-flex; gap: 4px; min-height: 44px; padding: 0 10px 0 0; align-items: center; color: var(--accent-strong); font-weight: 650; }
.bar h1 { min-width: 0; overflow: hidden; font-size: clamp(26px, 5vw, 36px); text-overflow: ellipsis; white-space: nowrap; }
.clockbox { display: grid; justify-items: end; line-height: 1.1; }
.clock { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
.clockbox small { min-height: 1.2em; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.meta { display: flex; margin-top: 10px; align-items: center; justify-content: space-between; gap: 10px; }
.levels { display: flex; min-width: 0; padding: 3px; gap: 2px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); }
.levels button { min-height: 38px; padding: 0 12px; border-radius: 8px; color: var(--muted); font-size: 13.5px; font-weight: 600; }
.levels button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.round { margin: 0; color: var(--accent-strong); font-weight: 700; }
.share { min-height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--accent-strong); font-size: 13.5px; font-weight: 650; }
.rule { max-width: 46rem; margin: 12px 0 0; color: var(--ink-2); font-size: 15px; line-height: 1.45; }
.level-note { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

.stage { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 14px; }
.stage.with-side { align-items: stretch; }
.stage.sheet-stage { display: block; }
.board-wrap { width: min(100%, 520px); margin: 0 auto; }
.side { width: min(100%, 520px); margin: 0 auto; }
.placeholder { display: grid; width: min(100%, 520px); aspect-ratio: 1; margin: 0 auto; place-items: center; }
.placeholder.failed { aspect-ratio: auto; min-height: 220px; gap: 12px; align-content: center; text-align: center; color: var(--muted); }
.loading { margin: 0; color: var(--muted); font-size: 14px; opacity: 0; animation: appear .3s ease 150ms forwards; }
@keyframes appear { to { opacity: 1; } }
.status { min-height: 1.45em; margin: 12px auto 0; width: min(100%, 520px); color: var(--accent-strong); font-size: 14px; font-weight: 650; text-align: center; }

/* Dock and the solved panel share one slot; the panel grows in as the dock folds away. */
.foot { width: min(100%, 520px); margin: 10px auto 0; }
.fold { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .28s ease, opacity .2s ease; }
.fold > * { min-height: 0; overflow: hidden; }
.done-fold { grid-template-rows: 0fr; opacity: 0; }
.foot.is-solved .dock-fold { grid-template-rows: 0fr; opacity: 0; }
.foot.is-solved .done-fold { grid-template-rows: 1fr; opacity: 1; }
.dock { display: flex; gap: 6px; padding: 2px; }
.dock button { flex: 1 1 0; min-width: fit-content; min-height: 44px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink-2); font-size: 13.5px; font-weight: 650; white-space: nowrap; }
.dock button[aria-pressed="true"] { border-color: color-mix(in srgb, var(--accent) 50%, transparent); background: var(--accent-soft); color: var(--accent-strong); }
.done { padding: 2px; }
.done > * { margin-left: 0; margin-right: 0; }
.done { display: grid; gap: 10px; }
.done-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 16px 18px 0; }
.done { border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); border-radius: 14px; background: var(--accent-soft); }
.done h2 { margin: 0; font: 620 30px/1 var(--serif); letter-spacing: -.02em; }
.done-time { display: grid; margin: 0; justify-items: end; color: var(--muted); font-size: 13px; }
.done-time strong { color: var(--ink); font-size: 24px; font-variant-numeric: tabular-nums; }
.done-extra { margin: 0; padding: 0 18px; color: var(--ink-2); line-height: 1.45; }
.done-actions { display: flex; padding: 4px 18px 16px; align-items: center; gap: 10px; }
.done-actions .primary { flex: 1; }

.how { width: min(100%, 620px); margin: 22px auto 0; padding-top: 10px; border-top: 1px solid var(--line); color: var(--ink-2); }
.how summary { display: flex; min-height: 44px; align-items: center; cursor: pointer; color: var(--accent-strong); font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.how ul { margin: 4px 0 0; padding-left: 20px; }
.how li { margin: 6px 0; line-height: 1.5; }
.inline-glyph { display: inline-block; width: 1.3em; height: 1.3em; vertical-align: -.3em; color: var(--accent-strong); }
.inline-glyph .glyph { width: 100%; height: 100%; }
.toast { position: fixed; z-index: 10; bottom: max(18px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); padding: 10px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); box-shadow: var(--shadow); }

/* Boards */
.board { --n: 6; position: relative; width: 100%; aspect-ratio: 1; overflow: hidden; border: 2px solid var(--board-edge); border-radius: 10px; background: var(--board); box-shadow: var(--shadow); touch-action: none; user-select: none; -webkit-user-select: none; container-type: inline-size; }
.cells { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); grid-template-rows: repeat(var(--n), minmax(0, 1fr)); }
.cell { position: relative; display: grid; min-width: 0; min-height: 0; place-items: center; cursor: pointer; font: 600 calc(100cqi / var(--n) * .44)/1 var(--serif); }
.cell > * { grid-area: 1 / 1; }
.cell:focus-visible { outline: none; box-shadow: inset 0 0 0 3px var(--focus); }
.layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.ln { fill: none; vector-effect: non-scaling-stroke; stroke-linecap: square; }
.ln1 { stroke: var(--grid-thin); stroke-width: 1px; }
.ln2 { stroke: var(--grid-thick); stroke-width: 3px; }
.ln3 { stroke: var(--grid-wall); stroke-width: 6px; stroke-linecap: round; }
.board.shake { animation: shake .2s ease; }
.sheet.shake { animation: shake .2s ease; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.stage.is-solved .board { border-color: var(--accent); }
.stage.is-solved .cell { cursor: default; }
.cell.bad::after { content: ""; position: absolute; inset: 3px; border: 2.5px dashed var(--bad); border-radius: 4px; pointer-events: none; }

/* Zip */
.g-zip .cell.on { background: var(--path-cell); }
.g-zip .cell.start { background: var(--accent-soft); }
.zline { fill: none; stroke: var(--path); stroke-width: .34; stroke-linecap: round; stroke-linejoin: round; }
.zhead { fill: var(--board); stroke: var(--path-edge); stroke-width: .06; }
.num-disc { fill: var(--ink); }
.num-text { fill: var(--board); font-family: var(--sans); font-weight: 650; text-anchor: middle; }

/* Queens */
.g-queens .cell { background: var(--rg); }
.rg0 { --rg: var(--c0); } .rg1 { --rg: var(--c1); } .rg2 { --rg: var(--c2); } .rg3 { --rg: var(--c3); } .rg4 { --rg: var(--c4); } .rg5 { --rg: var(--c5); }
.rg6 { --rg: var(--c6); } .rg7 { --rg: var(--c7); } .rg8 { --rg: var(--c8); } .rg9 { --rg: var(--c9); } .rg10 { --rg: var(--c10); } .rg11 { --rg: var(--c11); }
.crown { width: 64%; height: auto; overflow: visible; }
.crown path, .crown rect { fill: var(--gold); stroke: var(--gold-edge); stroke-width: 1.3; stroke-linejoin: round; }
.dot { display: block; width: 20%; aspect-ratio: 1; border-radius: 50%; background: var(--ink-2); opacity: .7; }
.g-queens .cell.bad .crown path, .g-queens .cell.bad .crown rect { stroke: var(--bad); stroke-width: 2; }

/* Tango */
.g-tango .cell.given { background: var(--given); }
.g-tango .cell.given::before { content: ""; position: absolute; top: 4px; right: 4px; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); }
.sun, .moon { width: 64%; height: 64%; overflow: visible; }
.sun .rays path { fill: none; stroke: var(--sun-edge); stroke-width: 2; stroke-linecap: round; }
.sun circle { fill: var(--sun); stroke: var(--sun-edge); stroke-width: 1.2; }
.moon path { fill: var(--moon); stroke: var(--moon-edge); stroke-width: 1.2; }
.signs { position: absolute; inset: 0; pointer-events: none; }
.sign { position: absolute; display: grid; width: clamp(22px, 8cqi, 34px); aspect-ratio: 1; place-items: center; transform: translate(-50%, -50%); border: 1.5px solid var(--grid-thick); border-radius: 50%; background: var(--surface); color: var(--ink); font: 800 clamp(14px, 5cqi, 21px)/1 var(--sans); }

/* Sudoku */
.g-sudoku .cell.peer { background: var(--peer); }
.g-sudoku .cell.given { background: var(--given); color: var(--given-ink); font-weight: 600; font-family: var(--sans); }
.g-sudoku .cell.entered { color: var(--entered-ink); font-weight: 500; }
.g-sudoku .cell.same { background: var(--same); }
.g-sudoku .cell.sel { background: var(--accent); color: var(--on-accent); }
.g-sudoku .cell.sel .notes { color: var(--on-accent); }
.g-sudoku .cell.bad .digit { text-decoration: underline wavy var(--bad) 2px; text-underline-offset: 3px; }
.g-sudoku .cell.bad:not(.sel) { color: var(--bad); }
.notes { display: grid; width: 92%; height: 92%; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); place-items: center; color: var(--muted); font: 600 calc(100cqi / var(--n) * .2)/1 var(--sans); }
.notes.six { grid-template-rows: repeat(2, 1fr); }
.notes i { font-style: normal; }
.pad { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 6px; }
.pad .digit { grid-column: span 2; }
.pad .tool { grid-column: span 3; }
.pad.six .tool { grid-column: span 6; }
.pad button { min-height: 48px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }
.pad .digit { font: 620 22px/1 var(--serif); }
.pad .digit.same { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); }
.pad .digit.done { opacity: .4; }
.pad .tool { color: var(--ink-2); font-size: 13.5px; font-weight: 700; }
.pad .tool[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
.pad.pencil .digit { font-size: 16px; color: var(--muted); }

/* Patches */
.g-patches .cell.pc0 { background: color-mix(in srgb, var(--c0) 75%, var(--board)); } .g-patches .cell.pc1 { background: color-mix(in srgb, var(--c1) 75%, var(--board)); }
.g-patches .cell.pc2 { background: color-mix(in srgb, var(--c2) 75%, var(--board)); } .g-patches .cell.pc3 { background: color-mix(in srgb, var(--c3) 75%, var(--board)); }
.g-patches .cell.pc4 { background: color-mix(in srgb, var(--c4) 75%, var(--board)); } .g-patches .cell.pc5 { background: color-mix(in srgb, var(--c5) 75%, var(--board)); }
.g-patches .cell.pc6 { background: color-mix(in srgb, var(--c6) 75%, var(--board)); } .g-patches .cell.pc7 { background: color-mix(in srgb, var(--c7) 75%, var(--board)); }
.g-patches .cell.preview { background: color-mix(in srgb, var(--accent) 30%, var(--board)); }
.g-patches .cell.preview.no { background: repeating-linear-gradient(45deg, var(--bad-soft) 0 6px, var(--board) 6px 12px); }
.g-patches .cell.anchor { box-shadow: inset 0 0 0 3px var(--accent); }
.clues-layer { position: absolute; inset: 0; pointer-events: none; }
.clue { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 1px; transform: translate(-50%, -50%); color: var(--ink); }

          h('span', { class: 'tonight-title', text: tonightSub })),
        h('span', { class: 'tonight-go', text: go })));
    SHELVES.forEach(function (shelf) {
      const row = h('div', { class: 'shelf' });
      shelf[1].forEach(function (id) { row.appendChild(tile(id)); });
      main.appendChild(h('section', { class: 'shelf-block' }, h('h2', { text: shelf[0] }), row));
    });
    return main;
  }
  function bestFor(id) {
    let secs = null;
    Object.keys(store.best).forEach(function (key) {
      if (key.indexOf(id + '/') === 0 && (secs == null || store.best[key] < secs)) secs = store.best[key];
    });
    return secs;
  }
  function tile(id) {
    const g = game(id);
    const saved = store.saved[id];
    let sub = g.copy.verb;
    let extra = '';
    if (saved) {
      sub = COPY.carryOn + ' · ' + (LEVEL[saved.level] || saved.level);
      extra = fmt(saved.elapsed || 0);
    } else if (bestFor(id) != null) extra = COPY.best + ' ' + fmt(bestFor(id) * 1000);
    return h('button', { type: 'button', class: 'tile' + (saved ? ' saved' : ''), 'data-game': id, onclick: function () { openGame(id, null, null, { push: true }); } },
      h('span', { class: 'art', html: g.art }),
      h('span', { class: 'tile-name', text: nameOf(id) }),
      h('span', { class: 'tile-sub' }, sub, extra ? h('span', { class: 'tile-extra', text: extra }) : null));
  }

  function summaryView() {
    const t = tonight();
    const list = h('ol', { class: 'times' });
    let total = 0;
    t.times.forEach(function (item) {
      total += item.ms;
      list.appendChild(h('li', null, nameOf(item.game), h('span', { text: fmt(item.ms) })));
    });
    list.appendChild(h('li', { class: 'total' }, COPY.summaryTotal, h('span', { text: fmt(total) })));
    return h('main', { class: 'summary' },
      h('p', { class: 'eyebrow', text: COPY.tonight }),
      h('h1', { text: COPY.summaryTitle }),
      h('p', { class: 'lede', text: COPY.summaryLede }),
      list,
      h('button', { type: 'button', class: 'primary', 'data-act': 'home', onclick: function () { goHome(true); } }, COPY.allGames));
  }

  function gameView() {
    const g = game();
    const main = h('main', { class: 'play g-' + S.game });
    const best = store.best[S.game + '/' + S.level];
    main.appendChild(h('header', { class: 'bar' },
      h('button', { type: 'button', class: 'back', 'data-act': 'home', onclick: function () { goHome(true); } }, h('span', { 'aria-hidden': 'true', text: '←' }), COPY.back),
      h('h1', { text: nameOf(S.game) }),
      h('div', { class: 'clockbox' },
        h('span', { id: 'clock', class: 'clock', 'aria-label': 'Time', text: fmt(now()) }),
        h('small', { id: 'best', text: best != null ? COPY.best + ' ' + fmt(best * 1000) : '' }))));
    const meta = h('div', { class: 'meta' });
    if (S.round) meta.appendChild(h('p', { class: 'round', text: COPY.tonightOf(ORDER.indexOf(S.game) + 1) }));
    else {
      const seg = h('div', { class: 'levels', role: 'group', 'aria-label': COPY.difficulty });
      levels(S.game).forEach(function (id) {
        seg.appendChild(h('button', { type: 'button', 'data-level': id, 'aria-pressed': String(id === S.level), onclick: function () { if (id !== S.level) openGame(S.game, id, null, {}); } }, LEVEL[id] || id));
      });
      meta.appendChild(seg);
    }
    meta.appendChild(h('button', { type: 'button', class: 'share', 'data-act': 'share', onclick: share }, COPY.share));
    main.appendChild(meta);
    main.appendChild(h('p', { class: 'rule', html: typeof g.copy.rule === 'function' ? g.copy.rule(S.puzzle) : g.copy.rule }));
    main.appendChild(h('p', { class: 'level-note', id: 'level-note', text: levelNote() }));
    const stage = h('div', { class: 'stage', id: 'stage' });
    if (!S.puzzle) {
      stage.classList.add('waiting');
      stage.appendChild(S.failed
        ? h('div', { class: 'placeholder failed' }, h('p', { text: COPY.failed }), h('button', { type: 'button', class: 'primary', onclick: newPuzzle }, COPY.tryAgain))
        : h('div', { class: 'placeholder', 'aria-busy': 'true' }, h('p', { class: 'loading', text: COPY.loading })));
    }
    main.appendChild(stage);
    main.appendChild(h('p', { class: 'status', id: 'status', role: 'status', 'aria-live': 'polite' }));
    main.appendChild(h('div', { class: 'foot', id: 'foot' },
      h('div', { class: 'fold dock-fold' }, h('div', { class: 'dock', id: 'dock' })),
      h('div', { class: 'fold done-fold' }, h('div', { class: 'done', id: 'done' }))));
    const how = h('details', { class: 'how' }, h('summary', { text: COPY.howToPlay }));
    const list = h('ul');
    g.copy.how.forEach(function (line) { list.appendChild(h('li', { html: line })); });
    how.appendChild(list);
    main.appendChild(how);
    if (S.toast) main.appendChild(h('div', { class: 'toast', role: 'status', text: S.toast }));
    return main;
  }
  function levelNote() {
    const g = game();
    const label = LEVEL[S.level] || S.level;
    const extra = S.puzzle && g.levelNote ? g.levelNote(S.puzzle, S.level) : (g.copy.levels && g.copy.levels[S.level]) || '';
    return label + (extra ? ' · ' + extra : '');
  }

  function mountGame() {
    const stage = document.getElementById('stage');
    if (!stage) return;
    stage.innerHTML = '';
    stage.className = 'stage' + (game().side ? ' with-side' : '') + (game().sheet ? ' sheet-stage' : '');
    S.ctx.stage = stage;
    game().mount(S.ctx, stage);
    paint();
  }

  function paint() {
    if (S.view !== 'game' || !S.puzzle || !S.ctx || !S.ctx.stage) return;
    game().paint(S.ctx);
    paintStatus();
    paintFoot();
    const stage = S.ctx.stage;
    stage.classList.toggle('is-solved', S.solved);
    const clock = document.getElementById('clock');
    if (clock) clock.textContent = fmt(now());
  }
  function paintBoard() {
    if (S.ctx && S.ctx.stage) game().paint(S.ctx);
    paintStatus();
  }
  function paintStatus() {
    const node = document.getElementById('status');
    if (!node || !S.puzzle) return;
    const text = S.note || (S.solved ? COPY.solvedIn(fmt(S.elapsed)) : game().status(S.ctx));
    if (node.textContent !== text) node.textContent = text;
  }
  function paintFoot() {
    const foot = document.getElementById('foot');
    const dock = document.getElementById('dock');
    const done = document.getElementById('done');
    if (!foot) return;
    foot.classList.toggle('is-solved', S.solved);
    dock.parentNode.inert = S.solved;
    done.parentNode.inert = !S.solved;
    const g = game();
    const hintLabel = g.hintLabel ? g.hintLabel(S.ctx) : COPY.hint;
    const key = [S.undo.length > 0, hintLabel, store.check, S.solved, S.round].join('|');
    if (dock._key !== key) {
      dock._key = key;
      const keep = document.activeElement && dock.contains(document.activeElement) ? document.activeElement.getAttribute('data-act') : null;
      dock.innerHTML = '';
      dock.appendChild(h('button', { type: 'button', 'data-act': 'undo', disabled: !S.undo.length || S.solved, onclick: undo }, COPY.undo));
      dock.appendChild(h('button', { type: 'button', 'data-act': 'hint', disabled: S.solved, onclick: hint }, hintLabel));
      if (g.check) dock.appendChild(h('button', { type: 'button', 'data-act': 'check', 'aria-pressed': String(!!store.check), onclick: toggleCheck }, COPY.check));
      if (!S.round) dock.appendChild(h('button', { type: 'button', 'data-act': 'new', onclick: newPuzzle }, COPY.newPuzzle));
      if (keep) { const again = dock.querySelector('[data-act="' + keep + '"]'); if (again && !again.disabled) again.focus(); }
    }
    if (S.solved && !done._filled) {
      done._filled = true;
      const r = S.result || { ms: S.elapsed, best: null };
      const t = S.round ? tonight() : null;
      const label = S.round ? (t.index >= ORDER.length ? COPY.tonightTimes : COPY.nextGame) : COPY.nextPuzzle;
      const extra = g.wonLine ? g.wonLine(S.ctx) : '';
      const primary = h('button', { type: 'button', class: 'primary', 'data-act': 'next', onclick: next }, label);
      done.appendChild(h('div', { class: 'done-head' },
        h('h2', { text: COPY.solved }),
        h('p', { class: 'done-time' }, h('strong', { text: fmt(r.ms) }), h('span', { text: r.helped ? COPY.helped : r.newBest ? COPY.newBest : r.best != null ? COPY.bestWas(fmt(r.best * 1000)) : '' }))));
      if (extra) done.appendChild(h('p', { class: 'done-extra', html: extra }));
      done.appendChild(h('div', { class: 'done-actions' }, primary, h('button', { type: 'button', class: 'link', 'data-act': 'home', onclick: function () { goHome(true); } }, COPY.allGames)));
      const best = document.getElementById('best');
      if (best && store.best[S.game + '/' + S.level] != null) best.textContent = COPY.best + ' ' + fmt(store.best[S.game + '/' + S.level] * 1000);
      if (document.activeElement && document.activeElement !== document.body && !/INPUT/.test(document.activeElement.tagName)) primary.focus({ preventScroll: true });
    } else if (!S.solved && done._filled) {
      done._filled = false;
      done.innerHTML = '';
    }
  }

  /* ---------- Actions ---------- */
  function undo() {
    if (S.solved || !S.undo.length) return;
    S.play = JSON.parse(S.undo.pop());
    S.group = null;
    S.note = '';
    if (game().afterUndo) game().afterUndo(S.ctx);
    saveSlot();
    paint();
  }
  function hint() {
    if (S.solved || !S.puzzle) return;
    S.group = null;
    S.helped = true;
    const changedAny = S.ctx.act(function (play) { game().hint(S.puzzle, play, S.ctx); }, { note: COPY.oneStep });
    if (!changedAny) paint();
  }
  function toggleCheck() {
    store.check = !store.check;
    persist();
    paint();
  }
  function newPuzzle() {
    pauseClock();
    S.puzzle = null;
    if (!S.round && S.game) delete store.saved[S.game];
    persist();
    S.failed = false;
    openGame(S.game, S.level, freshSeed(), { fresh: true });
  }
  function next() {
    if (S.round) { startTonight(); return; }
    openGame(S.game, S.level, freshSeed(), { fresh: true });
  }
  function share() {
    const say = function (text) {
      S.toast = text;
      const old = document.querySelector('.toast');
      if (old) old.remove();
      const main = document.querySelector('main');
      if (main) main.appendChild(h('div', { class: 'toast', role: 'status', text: text }));
      clearTimeout(share.timer);
      share.timer = setTimeout(function () { S.toast = ''; const t = document.querySelector('.toast'); if (t) t.remove(); }, 1800);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(location.href).then(function () { say(COPY.copied); }, function () { say(COPY.copyFailed); });
    else say(COPY.copyFailed);
  }

  /* ---------- Navigation ---------- */
  function leave() {
    if (S.view === 'game') { pauseClock(); saveSlot(); }
    S.token++;
  }
  function goHome(push) {
    leave();
    S.view = 'home';
    S.round = false;
    S.puzzle = null;
    S.ctx = null;
    if (push && location.hash) history.pushState(null, '', location.pathname + location.search);
    render();
    window.scrollTo(0, 0);
  }
  function startTonight() {
    const t = tonight();
    if (t.index >= ORDER.length) {
      leave();
      S.view = 'summary';
      render();
      return;
    }
    const id = ORDER[t.index];
    const level = tonightLevel(id);
    openGame(id, level, dailySeed(id, level), { push: S.view === 'home', round: true });
  }
  /* Open a game. With no seed, resume that game's saved puzzle at this level, else deal a new one. */
  function openGame(id, level, seed, opts) {
    opts = opts || {};
    leave();
    const g = game(id);
    const allowed = levels(id);
    if (!level) level = (!opts.round && store.saved[id] && store.saved[id].level) || store.level[id];
    if (allowed.indexOf(level) < 0) level = allowed.indexOf('easy') >= 0 ? 'easy' : allowed[0];
    const saved = opts.round ? tonight().slot : store.saved[id];
    if (!seed) seed = saved && saved.game === id && saved.level === level ? saved.seed : freshSeed();
    if (!opts.round) { store.level[id] = level; persist(); }
    Object.assign(S, {
      view: 'game', game: id, level: level, seed: seed, round: !!opts.round,
      puzzle: null, play: null, ui: {}, undo: [], group: null, pending: null,
      elapsed: 0, running: false, solved: false, helped: false, note: '', result: null, failed: false
    });
    const url = '#' + [id, level, encodeURIComponent(seed)].join('/');
    if (opts.push) history.pushState(null, '', url);
    else history.replaceState(null, '', url);
    render();
    window.scrollTo(0, 0);
    const token = ++S.token;
    // Let the page paint first; the loading line only fades in if dealing takes over ~150 ms.
    requestAnimationFrame(function () {
      setTimeout(function () {
        if (token !== S.token) return;
        deal(id, level, seed, opts, g);
      }, 0);
    });
  }
  function deal(id, level, seed, opts, g) {
    const e = engine(id);
    let puzzle;
    try { puzzle = e.generate(level, seed); } catch (err) { puzzle = null; }
    if (!puzzle) {
      S.failed = true;
      render();
      return;
    }
    S.puzzle = puzzle;
    S.sig = sig(puzzle);
    S.play = g.fresh(puzzle);
    S.ui = {};
    const saved = opts.round ? tonight().slot : store.saved[id];
    if (saved && saved.game === id && saved.level === level && saved.seed === seed && !opts.fresh) {
      if (saved.sig === S.sig && saved.play) {
        S.play = saved.play;
        S.undo = Array.isArray(saved.undo) ? saved.undo : [];
        S.elapsed = saved.elapsed || 0;
        S.helped = !!saved.helped;
        if (S.undo.length || S.elapsed) startClock();
      } else {
        if (opts.round) tonight().slot = null;
        else delete store.saved[id];
        persist();
        S.note = COPY.updated;
      }
    }
    if (g.solved(S.puzzle, S.play)) S.play = g.fresh(puzzle);
    S.ctx = makeCtx();
    S.ctx.ui = S.ui;
    const note = document.getElementById('level-note');
    if (note) note.textContent = levelNote();
    const rule = document.querySelector('.play .rule');
    if (rule && typeof g.copy.rule === 'function') rule.innerHTML = g.copy.rule(puzzle);
    mountGame();
  }
  function route() {
    const raw = location.hash.replace(/^#/, '');
    if (!raw) { if (S.view !== 'home') goHome(false); else render(); return; }
    const parts = raw.split('/');
    const id = parts[0];
    if (!UI.games[id] || !parts[2]) { history.replaceState(null, '', location.pathname + location.search); goHome(false); return; }
    const level = parts[1];
    const seed = decodeURIComponent(parts.slice(2).join('/'));
    if (S.view === 'game' && S.game === id && S.level === level && S.seed === seed) return;
    const t = tonight();
    const round = seed === dailySeed(id, level) && ORDER[t.index] === id;
    openGame(id, level, seed, { round: round });
  }

  /* ---------- Global keys ---------- */
  document.addEventListener('keydown', function (e) {
    if (S.view !== 'game' || e.defaultPrevented || e.metaKey || e.ctrlKey || e.altKey) return;
    const tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (e.key === 'Escape') { goHome(true); return; }
    if (!S.puzzle || S.solved) return;
    if (game().key && game().key(S.ctx, e)) { e.preventDefault(); return; }
    if (e.key === 'u' || e.key === 'U') undo();
    else if (e.key === 'h' || e.key === 'H') hint();
  });

  window.addEventListener('pagehide', function () { if (S.view === 'game') { S.elapsed = now(); S.t0 = performance.now(); saveSlot(); } });
  document.addEventListener('visibilitychange', function () {
    if (S.view !== 'game') return;
    if (document.visibilityState === 'hidden') { pauseClock(); saveSlot(); }
    else if (S.puzzle && !S.solved && (S.undo.length || S.elapsed)) startClock();
  });
  window.addEventListener('popstate', route);
  window.addEventListener('hashchange', route);

  UI.shell = { COPY: COPY, ORDER: ORDER, store: function () { return store; }, state: S };

  function boot() {
    if (boot.done) return;
    boot.done = true;
    if (!app()) document.body.appendChild(h('div', { id: 'app' }));
    route();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
