<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f8f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Nook. Nine puzzles, no ads, no accounts.">
<title>Nook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,560;0,9..144,620;1,9..144,560&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #17242b;
  --muted: #62727a;
  --paper: #fff;
  --canvas: #f5f8f8;
  --line: #d9e2e3;
  --teal: #087f82;
  --teal-dark: #075e64;
  --teal-pale: #e1f3f1;
  --blue-pale: #e8effa;
  --rose: #b64953;
  --serif: Fraunces, "Iowan Old Style", Georgia, serif;
  --sans: "Avenir Next", "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--canvas); color: var(--ink); font: 400 15px/1.45 var(--sans); }
button, input, summary { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; background: transparent; border: 0; }
button:disabled { cursor: default; opacity: .45; }
.cell { cursor: pointer; }
.cell:focus-visible { z-index: 4; outline: 3px solid #075e64; outline-offset: -3px; }
button:focus-visible, summary:focus-visible, input:focus-visible, .tile:focus-visible, .tonight:focus-visible {
  outline: 3px solid #168ca0; outline-offset: 3px;
}
#app { min-height: 100dvh; }
.home, .play, .summary { width: min(1120px, 100%); margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom)); }
.eyebrow { margin: 0 0 6px; color: var(--teal-dark); font-size: 11px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
h1 { margin: 0; font: 620 clamp(40px, 7vw, 66px)/.98 var(--serif); letter-spacing: -.045em; }
.lede { max-width: 36rem; margin: 12px 0 0; color: var(--muted); font-size: 16px; }
.home .mast { padding: 6px 0 10px; }
.solid, .ghost { min-height: 44px; padding: 0 16px; border: 1px solid var(--teal); border-radius: 9px; font-weight: 650; }
.solid { background: var(--teal); color: white; }
.ghost { background: white; color: var(--ink); border-color: var(--line); }
.tonight { display: flex; width: 100%; min-height: 86px; margin-top: 18px; padding: 15px 18px; align-items: center; justify-content: space-between; gap: 12px; text-align: left; border: 1px solid #c9e3e1; border-radius: 14px; background: var(--teal-pale); color: var(--ink); }
.tonight .eyebrow { margin: 0; }
.tonight-copy { display: grid; gap: 3px; }
.tonight-title { font: 620 clamp(23px, 4vw, 30px)/1.05 var(--serif); letter-spacing: -.025em; }
.tonight-go { display: grid; min-height: 42px; padding: 0 17px; place-items: center; border-radius: 8px; background: var(--teal); color: white; font-size: 13px; font-weight: 700; }
.shelf-block { margin-top: 24px; }
.shelf-block h2 { margin: 0 0 10px; color: #52666e; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.shelf { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tile-wrap { position: relative; min-width: 0; }
.tile { display: grid; grid-template-columns: 64px minmax(0,1fr); grid-template-rows: auto auto; align-items: center; column-gap: 12px; row-gap: 3px; width: 100%; min-height: 88px; padding: 12px; text-align: left; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); color: var(--ink); box-shadow: 0 2px 5px #17242b0a; transition: border-color .15s, box-shadow .15s, transform .15s; }
.tile-wrap.paused .tile { padding-right: 52px; border-color: #91cbc7; }
.mark { grid-row: 1 / span 2; width: 64px; height: 48px; display: grid; place-items: center; }
.mini-svg { display: block; width: 64px; height: 48px; }
.tile-name { min-width: 0; font: 620 22px/1.05 var(--serif); letter-spacing: -.025em; }
.tile-how { color: var(--muted); font-size: 12px; line-height: 1.3; }
.tile-best { display: inline-block; margin-left: 5px; color: var(--teal-dark); font-size: 11px; font-variant-numeric: tabular-nums; }
.fresh { position: absolute; z-index: 1; top: 4px; right: 5px; min-height: 34px; padding: 0 8px; color: var(--teal-dark); font-size: 11px; font-weight: 700; text-transform: uppercase; }
.tile:active, .tonight:active { transform: translateY(1px); }
@media (hover:hover) { .tile:hover, .tonight:hover { transform: translateY(-2px); border-color: #9bc9c7; box-shadow: 0 5px 14px #17242b12; } }

.bar { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 8px 14px; align-items: center; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.back { min-height: 40px; padding: 0 9px 0 0; color: var(--teal-dark); font-weight: 650; }
.titles { grid-column: 2; grid-row: 1; min-width: 0; }
.titles h1 { font-size: clamp(28px, 5vw, 38px); }
.status { min-height: 1.3em; margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.clock { grid-column: 3; grid-row: 1; text-align: right; font-size: 18px; font-variant-numeric: tabular-nums; font-weight: 650; }
.clock small { display: block; color: var(--muted); font-size: 10px; font-weight: 500; letter-spacing: .04em; }
.switch { grid-column: 1 / 3; grid-row: 2; display: flex; width: fit-content; max-width: 100%; flex-wrap: wrap; gap: 3px; align-items: center; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: white; }
.diff-label { padding: 0 8px 0 6px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.switch button { min-height: 36px; padding: 0 12px; border-radius: 7px; color: #52666e; font-size: 13px; }
.switch button.on { background: var(--teal); color: white; }
.seed { grid-column: 3; grid-row: 2; justify-self: end; min-height: 36px; max-width: 42vw; overflow: hidden; padding: 0 11px; text-overflow: ellipsis; white-space: nowrap; border: 1px solid var(--line); border-radius: 8px; background: white; color: var(--teal-dark); font-size: 12px; font-weight: 650; }
.game-intro { max-width: 52rem; margin: 13px auto 0; color: #52666e; font-size: 14px; }
.difficulty-note { max-width: 52rem; margin: 8px auto 0; color: var(--muted); font-size: 13px; line-height: 1.4; }
.progress-line { width: min(100%, 520px); margin: 12px auto 0; color: var(--teal-dark); font-size: 12px; font-weight: 650; }
.stage { display: flex; flex-direction: column; align-items: center; gap: 18px; margin: 14px auto 0; }
.board-wrap, .side { position: relative; width: min(100%, 480px); }
.board { --n: 6; position: relative; display: grid; width: 100%; aspect-ratio: 1; grid-template-columns: repeat(var(--n), minmax(0,1fr)); grid-template-rows: repeat(var(--n), minmax(0,1fr)); overflow: visible; container-type: inline-size; touch-action: none; user-select: none; }
.cell { position: relative; display: flex; min-width: 0; min-height: 0; align-items: center; justify-content: center; font: 560 16px/1 var(--serif); font-size: calc(90cqi / var(--n) * .42); }
.board.pending { background: #edf2f2; border: 1px solid var(--line); border-radius: 12px; }
.board.zip, .board.sudoku, .board.queens, .board.tango, .board.patches, .board.murdoku, .board.wend { overflow: hidden; border: 1px solid #52666e; border-radius: 9px; background: white; box-shadow: 0 5px 18px #17242b12; }
.board.zip { color: var(--ink); }
.board.zip .trace .line path:first-child { stroke: #075e64; }
.board.zip .trace .line path:nth-child(2) { stroke: #34a8a2; }
.board.zip .trace .line circle { fill: #fff; }
.board.zip .trace .marks circle { fill: #fff; stroke: #087f82; }
.board.zip .trace .marks text { fill: #17242b; }
.board.zip .cell { background: #fff; box-shadow: inset -1px -1px 0 #ced8da; }
.board.zip .cell.on-path { background: #bde9e4; }
.board.zip .cell.start { box-shadow: inset 0 0 0 3px var(--teal); }
.num { position: relative; z-index: 2; display: grid; width: 58%; aspect-ratio: 1; place-items: center; border: 2px solid var(--teal); border-radius: 50%; background: white; color: var(--teal-dark); font: 700 .75em/1 var(--sans); }
.wall-e, .wall-s { position: absolute; z-index: 3; background: #253940; pointer-events: none; }
.wall-e { top: 0; right: -2px; width: 4px; height: 100%; }.wall-s { bottom: -2px; left: 0; width: 100%; height: 4px; }
.trace { position: absolute; z-index: 1; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.board.queens { gap: 2px; padding: 2px; background: #43545b; }
.board.queens .cell-fill { position: absolute; z-index: 0; inset: 0; opacity: .7; }
.board.queens .cell { background: #f6f9f9; }
.crown { position: relative; z-index: 1; width: 70%; height: auto; }
.dot { position: relative; z-index: 1; width: 8px; height: 8px; border-radius: 50%; background: #344c55; }
.cell.bad { outline: 3px solid var(--rose); outline-offset: -4px; }
.cell.sel { box-shadow: inset 0 0 0 3px var(--teal); }
.board.sudoku .cell.sel { outline: 2px solid var(--teal); outline-offset: -3px; }
.board.sudoku .cell.sel.bad { outline-color: var(--rose); }
.board.tango { gap: 2px; padding: 3px; background: #64757b; }
.board.tango .cell { background: #fff; box-shadow: inset 0 0 0 1px #dbe3e4; }
.board.tango .cell.given { background: #e5eff0; box-shadow: inset 0 0 0 2px #91a9ad; }
.board.tango .moon path { fill: #635982; stroke: #44395e; }
.board.tango .sun g { stroke: #a86a22; }
.board.tango .sun circle { fill: #f0b84a; stroke: #8b5b14; }
.sun, .moon { display: block; width: 66%; height: 66%; overflow: visible; }
.edge { position: absolute; z-index: 3; display: grid; width: clamp(20px, 5.4cqi, 28px); height: clamp(20px, 5.4cqi, 28px); place-items: center; border: 1px solid #9bb7ba; border-radius: 50%; background: #fff; color: #145f67; box-shadow: 0 1px 4px #17242b22; font: 700 14px/1 var(--sans); pointer-events: none; }
.edge.e { top: 50%; right: -1px; transform: translate(50%,-50%); }.edge.s { bottom: -1px; left: 50%; transform: translate(-50%,50%); }
.board.sudoku { color: var(--ink); }
.board.sudoku .cell { background: white; color: #087f82; box-shadow: inset -1px -1px 0 #d8e1e2; }
.board.sudoku .cell.given { color: #26373e; font-weight: 700; }
.board.sudoku .cell.same { background: #e5f4f2; }
.board.sudoku .cell.box-r { box-shadow: inset -2px -1px 0 #52666e; }.board.sudoku .cell.box-b { box-shadow: inset -1px -2px 0 #52666e; }.board.sudoku .cell.box-r.box-b { box-shadow: inset -2px -2px 0 #52666e; }
.notes { display: grid; width: 88%; height: 88%; grid-template-columns: repeat(3,1fr); color: #77868c; font: 500 calc(70cqi / var(--n) * .16)/1 var(--sans); }.notes.six { grid-template-rows: 1fr 1fr; }.notes i { text-align: center; font-style: normal; }
.pad { display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 7px; }
.pad button { min-height: 46px; border: 1px solid var(--line); border-radius: 9px; background: white; color: var(--ink); font: 620 20px/1 var(--serif); }
.pad button.on, .pad button.armed { border-color: var(--teal); background: var(--teal); color: white; }.pad button.done { opacity: .45; }.pad button.tool { font: 650 11px/1 var(--sans); letter-spacing: .04em; text-transform: uppercase; }
.pad button.tool:last-child { grid-column: 3; }
.board.patches { background: #f5f8f8; color: var(--ink); }
.board.patches .cell { background: #f7f9f9; box-shadow: inset 0 0 0 1px #dce5e5; }
.board.patches .cell.seam-e { box-shadow: inset -2px 0 0 #52666e; }.board.patches .cell.seam-s { box-shadow: inset 0 -2px 0 #52666e; }.board.patches .cell.seam-e.seam-s { box-shadow: inset -2px -2px 0 #52666e; }
.stitch { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; color: #075e64; font-weight: 700; }
.glyph { width: 17px; height: 13px; border: 1.5px solid #087f82; }.glyph.tall { width: 10px; height: 18px; }.glyph.wide { width: 20px; height: 10px; }.glyph.diamond { width: 11px; height: 11px; border: 0; background: #087f82; transform: rotate(45deg); }
.cell.preview { background: #bde9e4 !important; }
.room-name { position: absolute; z-index: 1; top: 4px; left: 3px; max-width: calc(100% - 6px); overflow: hidden; padding: 1px 2px; border-radius: 3px; background: #fffE; color: #23363c; font: 700 10px/1.2 var(--sans); letter-spacing: .015em; text-overflow: ellipsis; white-space: nowrap; pointer-events: none; }
.board.murdoku { gap: 0; padding: 2px; background: #52666e; }
.board.murdoku .cell { box-shadow: inset -1px -1px 0 #17242b3b; }
.board.murdoku .cell-fill, .board.murdoku .wash { position: absolute; inset: 0; opacity: .6; }
.board.murdoku .cell.room-e { box-shadow: inset -3px 0 0 #405158; }.board.murdoku .cell.room-s { box-shadow: inset 0 -3px 0 #405158; }.board.murdoku .cell.room-e.room-s { box-shadow: inset -3px -3px 0 #405158; }
.furn { position: absolute; z-index: 1; right: 2px; bottom: 2px; display: flex; flex-direction: column; align-items: center; gap: 0; pointer-events: none; }
.furn em { max-width: 52px; overflow: hidden; color: #263b41; font: 650 clamp(8px,1.8cqi,10px)/1.05 var(--sans); text-overflow: ellipsis; white-space: nowrap; }.furn i { display: block; }
.furn.plant i { width: 11px; height: 11px; border-radius: 50%; background: #4c8270; }.furn.table i, .furn.bookshelf i { width: 15px; height: 8px; background: #638177; }.furn.bookshelf i { height: 12px; background: repeating-linear-gradient(#638177 0 3px,#e9f2ee 3px 4px); }.furn.statue i { width: 0; height: 0; border-right: 6px solid transparent; border-bottom: 11px solid #657b80; border-left: 6px solid transparent; }.furn.chair i, .furn.stool i { width: 10px; height: 10px; border: 1px solid #638177; }.furn.armchair i, .furn.sofa i { width: 19px; height: 10px; border-radius: 5px 5px 2px 2px; background: #739e98; }.furn.rug i { width: 20px; height: 9px; background: repeating-linear-gradient(90deg,#49a39c 0 3px,#d9f0ed 3px 6px); }
.token { position: relative; z-index: 2; display: flex; width: 52%; height: 52%; align-items: center; justify-content: center; border: 1.5px solid #34464c; border-radius: 50%; background: white; color: #203239; font: 700 calc(70cqi / var(--n) * .28)/1 var(--sans); box-shadow: 0 1px 3px #17242b24; }
.token.victim { border-color: #8c414b; background: #a94954; color: white; }.token.on { box-shadow: 0 0 0 2px #087f82; }.token.culprit { box-shadow: 0 0 0 2px #d49b31; }.token.bad { box-shadow: 0 0 0 2px var(--rose); }.cell.lit { outline: 2px solid #087f82; outline-offset: -3px; }
.side { display: flex; flex-direction: column; gap: 10px; }
.roster { display: flex; flex-wrap: wrap; gap: 6px; }.roster button { min-height: 40px; padding: 0 11px; border: 1px solid var(--line); border-radius: 8px; background: white; }.roster button.on { border-color: var(--teal); background: var(--teal-pale); color: var(--teal-dark); }
.slips { display: flex; max-height: none; flex-direction: column; gap: 6px; overflow: visible; }
.slip { margin: 0; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: white; color: #394b51; font: italic 15px/1.35 var(--serif); }.slip.on { border-color: #90c9c5; box-shadow: inset 3px 0 0 var(--teal); }
.side .status { padding: 10px 12px; border-radius: 8px; background: var(--teal-pale); color: #35585c; }
.dock { display: flex; width: min(100%, 480px); flex-wrap: wrap; gap: 8px; margin: 18px auto 0; padding: 0; }
.dock button { flex: 1 1 72px; min-height: 42px; padding: 0 9px; border: 1px solid var(--line); border-radius: 9px; background: white; color: #3c5158; font-size: 13px; font-weight: 600; }
.dock button[aria-pressed="true"] { border-color: #96cbc8; background: var(--teal-pale); color: var(--teal-dark); }
.rules { width: min(100%, 560px); margin: 17px auto 0; padding: 12px 0; border-top: 1px solid var(--line); color: #52666e; }
.rules summary { cursor: pointer; color: var(--teal-dark); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }.rules p { margin: 8px 0 0; font-size: 14px; line-height: 1.5; }
.toast { position: fixed; z-index: 5; bottom: max(18px,env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); padding: 10px 14px; border: 1px solid var(--line); border-radius: 9px; background: white; box-shadow: 0 5px 20px #17242b22; color: var(--ink); }
.summary ol { max-width: 460px; margin: 24px 0; padding: 0; list-style: none; }.summary li { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); font: 560 26px/1.2 var(--serif); }.summary li span { align-self: center; font: 600 16px var(--sans); font-variant-numeric: tabular-nums; }
.stage.solved .board { filter: saturate(1.04); }
.board.wend { gap: 3px; padding: 5px; background: #52666e; }
.board.wend .cell { border-radius: 5px; background: #fff; box-shadow: 0 1px 2px #17242b14; }
.board.wend .cell.wall { background: #435158; box-shadow: inset 0 0 0 1px #35464c; }.board.wend .cell.on-path { background: #bde9e4; }.board.wend .cell.locked { background: #dff0e9; }.board.wend .letter { color: #203239; font-weight: 700; text-transform: uppercase; }.board.wend .cell.locked .letter { color: #087f82; }
.blanks { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; margin: 12px 0 0; padding: 0; list-style: none; }.blanks li { min-height: 34px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: white; color: #63767b; font: 650 14px/1.2 var(--sans); letter-spacing: .12em; }.blanks li.in { border-color: #9bcfcb; background: var(--teal-pale); color: var(--teal-dark); letter-spacing: .04em; }
.sheet { width: min(100%, 560px); margin: 0 auto; }
.clues, .rungs { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.clues li, .rung { display: flex; min-height: 50px; align-items: center; gap: 12px; padding: 8px 13px; border: 1px solid var(--line); border-radius: 9px; background: white; color: var(--ink); }
.clues li { font: 560 24px/1.15 var(--serif); letter-spacing: -.02em; }.clues li span, .rung em { color: #7a898d; font: italic 14px var(--serif); }.clues li span { display: inline-block; min-width: 2.6em; margin-right: 8px; }.clues li.hid { color: #9eabad; }
.guess, .ends { display: grid; gap: 8px; margin-top: 12px; }.guess { grid-template-columns: minmax(0,1fr) auto; }
.sheet input { width: 100%; min-width: 0; min-height: 46px; padding: 0 12px; border: 1px solid #cbd8da; border-radius: 8px; background: white; color: var(--ink); font: 550 17px/1 var(--serif); }
.rung { padding: 6px; }.rung label { display: grid; min-width: 0; flex: 1; gap: 3px; }.rung input { text-transform: lowercase; letter-spacing: .18em; }.rung em { font-size: 12px; letter-spacing: 0; }.rung button { width: 38px; min-height: 38px; border: 1px solid var(--line); border-radius: 7px; background: #f5f8f8; color: var(--teal-dark); font-weight: 700; }.rung.hit { border-color: #a7d2ce; box-shadow: inset 3px 0 0 var(--teal); }
.end-clue { margin: 0 0 10px; color: #445960; font: italic 20px/1.35 var(--serif); }.ends { gap: 8px; }.ends > input { border-color: #91c8c4; background: var(--teal-pale); }.sheet.shake, .board.shake { animation: shake 180ms ease; }
@keyframes shake { 0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)} }
.stage.word { display: block; }
@media (min-width: 900px) {
  .stage.with-side { display: grid; grid-template-columns: minmax(360px,480px) minmax(250px,320px); justify-content: center; align-items: start; gap: 20px; }
  .stage.with-side .board-wrap, .stage.with-side .side { width: auto; }
  .stage.with-side .side { max-height: min(78vh,680px); overflow-y: auto; }
  .slips { max-height: none; }
}
@media (max-width: 720px) {
  .home, .play, .summary { padding-right: 16px; padding-left: 16px; }
  .home { padding-top: max(16px,env(safe-area-inset-top)); }
  .lede { font-size: 15px; }
  .tonight { min-height: 76px; margin-top: 13px; padding: 11px 12px; }
  .shelf-block { margin-top: 17px; }.shelf-block h2 { margin-bottom: 8px; }
  .shelf { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
  .tile { grid-template-columns: 42px minmax(0,1fr); column-gap: 7px; min-height: 74px; padding: 9px; border-radius: 10px; }
  .mark, .mini-svg { width: 42px; height: 34px; }.tile-name { font-size: 17px; }.tile-how { font-size: 11px; }
  .play { padding-top: max(12px,env(safe-area-inset-top)); }
  .bar { grid-template-columns: auto minmax(0,1fr) auto; gap: 6px 8px; padding-bottom: 10px; }
  .back { min-height: 38px; font-size: 12px; }.titles h1 { font-size: clamp(25px,7vw,34px); }.status { font-size: 11px; }
  .clock { font-size: 16px; }.clock small { font-size: 9px; }

        return;
      }
      const fresh = event.target.closest('[data-fresh]');
      if (fresh) {
        const id = fresh.getAttribute('data-fresh');
        const data = prefs();
        if (data.resume && data.resume.game === id) {
          data.resume = null;
          save(data);
        }
        state.round = null;
        const stored = (prefs().difficulty || {})[id] || 'easy';
        openGame(id, stored, freshSeed(), true);
        return;
      }
      const game = event.target.closest('[data-game]');
      if (game) {
        const id = game.getAttribute('data-game');
        const resume = resumeOf();
        state.round = null;
        if (resume && resume.game === id) openGame(id, resume.difficulty, resume.seed, true);
        else openGame(id, (prefs().difficulty || {})[id] || 'easy', freshSeed(), true);
        return;
      }
      const person = event.target.closest('[data-person]');
      if (person && state.play) {
        state.play.selected = person.getAttribute('data-person');
        render();
        return;
      }
      const digit = event.target.closest('[data-digit]');
      if (digit) { onDigit(Number(digit.getAttribute('data-digit'))); return; }
      const diff = event.target.closest('[data-diff]');
      if (diff) {
        openGame(state.game, diff.getAttribute('data-diff'), state.seed, false);
        return;
      }
      const act = event.target.closest('[data-act]');
      if (act) onAct(act.getAttribute('data-act'), act);
    });
    document.addEventListener('keydown', function (event) {
      if (state.view !== 'game') return;
      const typing = event.target && (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA');
      if (typing) {
        if (event.key === 'Enter' && state.puzzle && state.puzzle.game === 'pinpoint') {
          event.preventDefault();
          onAct('guess');
        }
        return;
      }
      const focusedCell = event.target.closest && event.target.closest('.cell');
      if (focusedCell && state.puzzle && !state.solved) {
        const r = Number(focusedCell.dataset.row), c = Number(focusedCell.dataset.col);
        const n = state.puzzle.rows || state.puzzle.n || state.puzzle.size;
        const directions = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
        if (directions[event.key]) {
          event.preventDefault();
          const dir = directions[event.key];
          const next = document.querySelector('[data-row="' + Math.max(0, Math.min(n - 1, r + dir[0])) + '"][data-col="' + Math.max(0, Math.min(n - 1, c + dir[1])) + '"]');
          if (next) { focusedCell.tabIndex = -1; next.tabIndex = 0; next.focus(); }
          return;
        }
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          activateCell(r, c, event.key);
          const next = document.querySelector('[data-row="' + r + '"][data-col="' + c + '"]');
          if (next) next.focus();
          return;
        }
      }
      if (event.key === 'Escape') showTable(true);
      if (event.key === 'u' || event.key === 'U') onAct('undo');
      if (event.key === 'h' || event.key === 'H') onAct('hint');
      if (event.key === 'N' && event.shiftKey) onAct('new');
      if ((event.key === 'p' || event.key === 'P') && state.puzzle && state.puzzle.game === 'sudoku') onAct('pencil');
      if (state.puzzle && state.puzzle.game === 'sudoku' && /^[1-9]$/.test(event.key) && Number(event.key) <= state.puzzle.size) onDigit(Number(event.key));
      if (state.puzzle && state.puzzle.game === 'sudoku' && (event.key === 'Backspace' || event.key === 'Delete')) onAct('clear');
    });
    window.addEventListener('pagehide', stash);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') { stash(); pauseClock(); }
      else if (state.view === 'game' && state.elapsed > 0 && !state.solved) startClock();
    });
    window.addEventListener('popstate', function () {
      const raw = location.hash.replace(/^#/, '');
      if (!raw) { showTable(false); return; }
      const parts = raw.split('/');
      const game = parts[0];
      const difficulty = parts[1];
      const seed = decodeURIComponent(parts.slice(2).join('/'));
      if (ORDER.indexOf(game) === -1 || !seed) { showTable(false); return; }
      openGame(game, difficulty, seed, false);
    });
    const raw = location.hash.replace(/^#/, '');
    if (!raw) render();
    else {
      const parts = raw.split('/');
      if (ORDER.indexOf(parts[0]) !== -1 && parts[2]) openGame(parts[0], parts[1], decodeURIComponent(parts.slice(2).join('/')), false);
      else render();
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
