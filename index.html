<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1612">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Nook. Nine puzzles, no ads, no accounts.">
<title>Nook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,560;0,9..144,620;1,9..144,560&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1c1612;
  --paper: #efe6d6;
  --paper-2: #f4efe6;
  --brass: #b08d57;
  --copper: #8c4a32;
  --moss: #3e5c50;
  --wine: #6d3038;
  --rose: #9a3b32;
  --night: #16181e;
  --moon: #d9d6ea;
  --sun: #f0b45a;
  --lead: #1a1614;
  --cream: #f3eadc;
  --line: rgba(243, 234, 220, 0.28);
  --serif: Fraunces, "Iowan Old Style", Palatino, Georgia, serif;
  --sans: "Avenir Next", "Segoe UI", sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--ink);
  color: var(--cream);
  font-family: var(--sans);
  font-weight: 400;
  letter-spacing: 0.01em;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0.18;
  background-image: radial-gradient(rgba(243, 234, 220, 0.14) 0.6px, transparent 0.6px);
  background-size: 3px 3px;
}
button, summary { font: inherit; color: inherit; }
button {
  background: transparent;
  border: 0;
  cursor: pointer;
  min-height: 44px;
  touch-action: manipulation;
}
button:focus-visible, summary:focus-visible, .tile:focus-visible, .tonight:focus-visible {
  outline: 2px solid var(--brass);
  outline-offset: 3px;
}
#app { position: relative; z-index: 1; min-height: 100dvh; }

.home, .play, .summary {
  width: min(1080px, 100%);
  margin: 0 auto;
  padding: calc(28px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
}
.eyebrow {
  margin: 0 0 8px;
  font-size: 13px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(243, 234, 220, 0.62);
}
h1 {
  margin: 0;
  font-family: var(--serif);
  font-weight: 560;
  font-size: clamp(44px, 8vw, 72px);
  letter-spacing: -0.035em;
  line-height: 0.92;
}
.home { position: relative; }
.home::before {
  content: "";
  position: absolute;
  z-index: -1;
  top: -40px;
  left: 8%;
  width: 78%;
  height: 280px;
  pointer-events: none;
  background: radial-gradient(ellipse at 50% 30%, rgba(232, 190, 130, 0.34), rgba(176, 141, 87, 0.08) 42%, transparent 70%);
}
.home h1::after {
  content: "";
  display: block;
  width: 64px;
  height: 2px;
  margin-top: 18px;
  background: var(--brass);
}
.lede {
  max-width: 36rem;
  margin: 14px 0 0;
  font-size: 17px;
  line-height: 1.45;
  color: rgba(243, 234, 220, 0.78);
}
.solid, .ghost {
  min-height: 44px;
  padding: 0 16px;
  border-radius: 2px;
}
.solid { background: var(--paper); color: var(--ink); }
.ghost { border: 1px solid var(--line); }

.tonight {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  width: 100%;
  margin-top: 22px;
  padding: 14px 16px;
  text-align: left;
  background: var(--paper);
  color: var(--ink);
  border-radius: 2px;
  box-shadow: 3px 3px 0 #0c0a08;
}
.tonight .eyebrow { color: var(--copper); margin: 0; }
.tonight-copy { display: grid; gap: 2px; }
.tonight-title {
  font-family: var(--serif);
  font-size: clamp(26px, 4vw, 34px);
  letter-spacing: -0.03em;
  line-height: 1;
}
.tonight-go {
  flex: none;
  min-height: 44px;
  padding: 0 16px;
  display: grid;
  place-items: center;
  background: var(--ink);
  color: var(--cream);
  border-radius: 2px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-size: 13px;
}
.shelf-block { margin-top: 26px; }
.shelf-block h2 {
  margin: 0 0 10px;
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(243, 234, 220, 0.55);
}
.shelf {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 10px;
}
.tile-wrap { position: relative; min-width: 0; }
.tile {
  display: grid;
  grid-template-columns: 56px 1fr;
  grid-template-rows: auto auto;
  column-gap: 10px;
  row-gap: 2px;
  align-items: center;
  width: 100%;
  min-width: 0;
  min-height: 76px;
  padding: 12px;
  text-align: left;
  background: var(--paper);
  color: var(--ink);
  border-radius: 2px;
  box-shadow: 3px 3px 0 #0c0a08;
}
.tile-wrap.paused .tile { box-shadow: 3px 3px 0 var(--copper); padding-right: 54px; }
.mark { grid-row: 1 / span 2; width: 56px; height: 40px; }
.tile-name {
  min-width: 0;
  font-family: var(--serif);
  font-size: 22px;
  letter-spacing: -0.03em;
  line-height: 1.05;
}
.tile-how {
  color: rgba(28, 22, 18, 0.68);
  font-size: 13px;
  line-height: 1.3;
}
.tile-best {
  position: absolute;
  right: 10px;
  bottom: 8px;
  font-variant-numeric: tabular-nums;
  font-size: 12px;
  letter-spacing: 0.04em;
  color: rgba(28, 22, 18, 0.5);
}
.fresh {
  position: absolute;
  z-index: 1;
  top: 6px;
  right: 6px;
  min-height: 32px;
  padding: 0 8px;
  color: var(--copper);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.tile:active, .tonight:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #0c0a08; }
@media (hover: hover) {
  .tile:hover, .tonight:hover { transform: translateY(-2px); }
  .tile:hover { box-shadow: 3px 5px 0 #0c0a08; }
  .tonight:hover { box-shadow: 3px 5px 0 #0c0a08; }
  .tile-wrap.paused .tile:hover { box-shadow: 3px 5px 0 var(--copper); }
}
@media (min-width: 900px) {
  .shelf { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); }
  .tile { grid-template-columns: 72px 1fr; min-height: 92px; }
  .mark, .tile .mini-svg { width: 72px; height: 52px; }
  .tile-name { font-size: 26px; }
}
.mini-svg { width: 56px; height: 40px; display: block; }

.bar {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 8px 12px;
  align-items: center;
}
.back {
  grid-column: 1;
  grid-row: 1;
  padding: 0 2px;
  letter-spacing: 0.04em;
}
.titles { grid-column: 2; grid-row: 1; min-width: 0; }
.titles h1 { font-size: clamp(32px, 6vw, 44px); }
.status {
  margin: 4px 0 0;
  min-height: 1.3em;
  color: rgba(243, 234, 220, 0.78);
  font-size: 15px;
}
.clock {
  grid-column: 3;
  grid-row: 1;
  text-align: right;
  font-variant-numeric: tabular-nums;
  font-size: 18px;
}
.clock small {
  display: block;
  color: rgba(243, 234, 220, 0.55);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.switch {
  grid-column: 1 / 3;
  grid-row: 2;
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
  justify-content: flex-start;
  background: #2a241e;
  padding: 3px;
  border-radius: 999px;
  width: fit-content;
  max-width: 100%;
}
.diff-label {
  align-self: center;
  padding: 0 10px 0 8px;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(243, 234, 220, 0.62);
}
.switch button {
  min-height: 44px;
  padding: 0 14px;
  border-radius: 999px;
  color: var(--cream);
}
.switch button.on { background: var(--brass); color: var(--ink); }
.seed {
  grid-column: 3;
  grid-row: 2;
  justify-self: end;
  max-width: 42vw;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-height: 36px;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.02em;
}

.stage {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  margin-top: 18px;
}
.stage::before {
  content: "";
  position: absolute;
  top: 10px;
  left: 50%;
  width: min(92vw, 760px);
  height: min(78vw, 640px);
  transform: translateX(-50%);
  background: radial-gradient(ellipse at center, rgba(232, 190, 130, 0.22), transparent 68%);
  z-index: 0;
  pointer-events: none;
}
.board-wrap, .side { position: relative; z-index: 1; width: min(92vw, calc(100dvh - 250px), 680px); }
.board {
  --n: 6;
  width: 100%;
  aspect-ratio: 1;
  display: grid;
  grid-template-columns: repeat(var(--n), 1fr);
  grid-template-rows: repeat(var(--n), 1fr);
  position: relative;
  touch-action: none;
  user-select: none;
  container-type: inline-size;
  border-radius: 2px;
}
.cell {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 0;
  font-family: var(--serif);
  font-size: 16px;
  font-size: calc(92cqi / var(--n) * 0.42);
  line-height: 1;
}
.board.pending {
  background: rgba(243, 234, 220, 0.05);
  box-shadow: inset 0 0 0 1px rgba(243, 234, 220, 0.16);
}
.board.zip {
  background: var(--paper-2);
  color: var(--ink);
  border: 3px solid var(--lead);
  box-shadow: 0 22px 48px rgba(0, 0, 0, 0.38);
}
.board.zip .cell { background: var(--paper-2); box-shadow: inset 0 0 0 1px rgba(28, 22, 18, 0.16); }
.board.zip .cell.on-path { background: #f6e3d6; }
.board.zip .cell.start { box-shadow: inset 0 0 0 2px var(--copper); }
.num {
  position: relative;
  z-index: 2;
  display: grid;
  place-items: center;
  width: 62%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #fffaf2, var(--paper-2) 62%);
  box-shadow: 0 1px 0 rgba(28, 22, 18, 0.28), inset 0 0 0 1px rgba(140, 74, 50, 0.45);
  font-weight: 560;
  color: var(--ink);
}
.wall-e, .wall-s { position: absolute; background: var(--lead); z-index: 3; pointer-events: none; }
.wall-e { right: -2px; top: 0; width: 4px; height: 100%; }
.wall-s { left: 0; bottom: -2px; height: 4px; width: 100%; }
.trace { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; overflow: visible; }

.board.queens { gap: 3px; padding: 3px; background: var(--lead); color: var(--ink); box-shadow: 0 22px 48px rgba(0, 0, 0, 0.38); }
.board.murdoku { gap: 0; padding: 4px; background: var(--lead); color: var(--ink); box-shadow: 0 22px 48px rgba(0, 0, 0, 0.38); }
.board.murdoku .cell.room-e { box-shadow: inset -3px 0 0 var(--lead); }
.board.murdoku .cell.room-s { box-shadow: inset 0 -3px 0 var(--lead); }
.board.murdoku .cell.room-e.room-s { box-shadow: inset -3px -3px 0 var(--lead); }
.crown { width: 70%; height: auto; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--lead); opacity: 0.55; }
.cell.bad { outline: 3px solid var(--rose); outline-offset: -4px; }
.cell.sel { box-shadow: inset 0 0 0 2px var(--ink); }

.board.tango {
  background: var(--night);
  gap: 0;
  color: var(--cream);
  box-shadow: 0 0 0 1px rgba(176, 141, 87, 0.55), 0 22px 48px rgba(0, 0, 0, 0.38);
}
.board.tango .cell {
  background: radial-gradient(circle at 50% 40%, #2a3142, #141820 70%);
  box-shadow: inset 0 0 0 1px rgba(243, 234, 220, 0.14);
}
.board.tango .cell.given { background: radial-gradient(circle at 50% 40%, #1c2433, #0e1118 72%); }
.sun, .moon { width: 72%; height: 72%; display: block; overflow: visible; }
.given .sun, .given .moon { opacity: 1; }
.edge {
  position: absolute;
  z-index: 2;
  width: 26px;
  height: 26px;
  display: grid;
  place-items: center;
  color: #1c1612;
  font-family: var(--serif);
  font-size: 16px;
  font-weight: 560;
  line-height: 1;
  pointer-events: none;
  background: #f3e6c4;
  color: #1c1612;
  border: 0;
  box-shadow: 0 1px 0 #0c0a08;
  border-radius: 50%;
}
.edge.e { right: 0; top: 50%; transform: translate(50%, -50%); }
.edge.s { left: 50%; bottom: 0; transform: translate(-50%, 50%); }

.board.sudoku { background: var(--paper-2); border: 2px solid var(--ink); color: var(--ink); box-shadow: 0 22px 48px rgba(0, 0, 0, 0.38); }
.board.sudoku .cell {
  background: var(--paper-2);
  color: var(--moss);
  box-shadow: inset -1px -1px 0 rgba(28, 22, 18, 0.16);
}
.board.sudoku .cell.given { color: var(--ink); font-weight: 560; }
.board.sudoku .cell.same { background: #e7efe9; }
.board.sudoku .cell.box-r { box-shadow: inset -2px -1px 0 var(--ink); }
.board.sudoku .cell.box-b { box-shadow: inset -1px -2px 0 var(--ink); }
.board.sudoku .cell.box-r.box-b { box-shadow: inset -2px -2px 0 var(--ink); }
.notes {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  width: 86%;
  height: 86%;
  font-family: var(--sans);
  font-size: calc(70cqi / var(--n) * 0.16);
  color: #8a8175;
}
.notes.six { grid-template-rows: 1fr 1fr; }
.notes i { font-style: normal; text-align: center; }
.pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.pad button {
  background: #322b24;
  color: var(--cream);
  border: 1px solid rgba(243, 234, 220, 0.28);
  border-radius: 2px;
  font-family: var(--serif);
  font-size: 22px;
  min-height: 48px;
}
.pad button.on, .pad button.armed { background: var(--paper); color: var(--ink); }
.pad button.done { opacity: 0.38; }
.pad button.tool { font-family: var(--sans); font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; }

.board.patches {
  background-color: #e6d7c2;
  background-image: repeating-linear-gradient(90deg, transparent 0 8px, rgba(90, 62, 40, 0.06) 8px 9px), repeating-linear-gradient(0deg, transparent 0 8px, rgba(90, 62, 40, 0.05) 8px 9px);
  gap: 0;
  padding: 0;
  color: var(--ink);
  border: 3px solid var(--lead);
  box-shadow: 0 22px 48px rgba(0, 0, 0, 0.38);
}
.board.patches .cell { background: transparent; box-shadow: inset 0 0 0 1px rgba(28, 22, 18, 0.1); }
.board.patches .cell.seam-e { box-shadow: inset -2px 0 0 var(--wine); }
.board.patches .cell.seam-s { box-shadow: inset 0 -2px 0 var(--wine); }
.board.patches .cell.seam-e.seam-s { box-shadow: inset -2px -2px 0 var(--wine); }
.stitch { color: var(--wine); font-weight: 560; display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; z-index: 1; }
.glyph { width: 18px; height: 14px; border: 1.6px solid var(--wine); }
.glyph.tall { width: 11px; height: 20px; }
.glyph.wide { width: 22px; height: 11px; }
.glyph.diamond { width: 12px; height: 12px; border: 0; background: var(--wine); transform: rotate(45deg); }
.cell.preview { background: rgba(109, 48, 56, 0.16); }
.board.shake { animation: shake 180ms ease; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}

.room-name {
  position: absolute;
  left: 6px;
  top: 6px;
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink);
  background: rgba(244, 239, 230, 0.72);
  padding: 2px 5px;
  pointer-events: none;
  z-index: 1;
}
.furn {
  position: absolute;
  right: 5px;
  bottom: 5px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  z-index: 1;
  pointer-events: none;
}
.furn em {
  font-style: normal;
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: 0.04em;
  color: rgba(28, 22, 18, 0.78);
}
.furn i { display: block; }
.furn.plant i { width: 16px; height: 16px; border-radius: 50% 50% 45% 45%; background: var(--moss); }
.furn.table i, .furn.bookshelf i { width: 22px; height: 12px; background: #6d513c; }
.furn.bookshelf i { height: 18px; background: repeating-linear-gradient(#6d513c 0 3px, #efe6d6 3px 4px); }
.furn.statue i { width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 14px solid #8d8478; }
.furn.chair i, .furn.stool i { width: 14px; height: 14px; border: 1.5px solid #6d513c; }
.furn.armchair i, .furn.sofa i { width: 26px; height: 14px; border-radius: 7px 7px 2px 2px; background: #7d5a49; }
.furn.rug i { width: 28px; height: 14px; background: repeating-linear-gradient(90deg, #8c4a32 0 3px, #e6c27a 3px 6px); }
.token {
  width: 58%;
  height: 58%;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--paper);
  color: var(--ink);
  border: 1.5px solid var(--ink);
  font-size: calc(70cqi / var(--n) * 0.28);
  position: relative;
  z-index: 1;
}
.token.victim { background: var(--wine); color: var(--cream); border-color: var(--wine); }
.token.on { box-shadow: 0 0 0 2px var(--brass); }
.token.culprit { box-shadow: 0 0 0 2px #e6c27a; }
.token.bad { box-shadow: 0 0 0 2px var(--rose); }
.cell.lit { outline: 1px solid var(--brass); outline-offset: -3px; }
.side { display: flex; flex-direction: column; gap: 8px; }
.roster { display: flex; flex-wrap: wrap; gap: 6px; }
.roster button {
  min-height: 40px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
}
.roster button.on { background: var(--paper); color: var(--ink); }
.slips { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow: auto; }
.slip {
  margin: 0;
  padding: 8px 10px;
  background: var(--paper);
  color: var(--ink);
  border-radius: 2px;
  font-family: var(--serif);
  font-style: italic;
  font-size: 16px;
  line-height: 1.35;
}
.slip.on { box-shadow: inset 3px 0 0 var(--copper); }
@media (min-width: 900px) {
  .stage.with-side { display: grid; grid-template-columns: min(calc(100dvh - 250px), 680px) minmax(240px, 300px); justify-content: center; align-items: center; }
  .stage.with-side .board-wrap, .stage.with-side .side { width: auto; }
  .slips { max-height: min(calc(100dvh - 250px), 680px); }
}

.dock {
  position: sticky;
  bottom: 0;
  z-index: 3;
  width: min(92vw, calc(100dvh - 250px), 680px);
  margin: 16px auto 0;
  display: flex;
  gap: 8px;
  padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
  background: var(--ink);
}
.dock button {
  flex: 1;
  border: 1px solid var(--line);
  border-radius: 2px;
  letter-spacing: 0.04em;
}
.dock button[aria-pressed="true"] { background: var(--paper); color: var(--ink); border-color: var(--paper); }
.rules { width: min(92vw, 560px); margin: 14px auto 0; color: rgba(243, 234, 220, 0.72); }
.rules summary { cursor: pointer; letter-spacing: 0.08em; text-transform: uppercase; font-size: 12px; }
.rules p { font-size: 15px; line-height: 1.45; }
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(76px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  background: var(--paper);
  color: var(--ink);
  padding: 10px 14px;
  border-radius: 2px;
  z-index: 5;
}
.summary ol { list-style: none; padding: 0; margin: 24px 0; max-width: 420px; }
.summary li {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  font-family: var(--serif);
  font-size: 28px;
}
.summary li span { font-family: var(--sans); font-variant-numeric: tabular-nums; font-size: 18px; align-self: center; }

    if (!app.id) app.id = 'app';
    const focus = document.activeElement && document.activeElement.getAttribute && document.activeElement.getAttribute('data-act');
    app.innerHTML = state.view === 'table' ? tableHTML() : state.view === 'summary' ? summaryHTML() : playHTML();
    if (focus) {
      const next = app.querySelector('[data-act="' + focus + '"]');
      if (next) next.focus();
    }
    document.title = state.view === 'table' ? 'Nook' : 'Nook · ' + meta(state.game).name;
  }
  function stash() {
    if (state.view !== 'game' || !state.puzzle || !state.play || state.solved) return;
    if (!state.timing && state.elapsed <= 0) return;
    const elapsed = state.timing ? performance.now() - state.started : state.elapsed;
    const data = prefs();
    data.resume = {
      game: state.game,
      difficulty: state.difficulty,
      seed: state.seed,
      play: state.play,
      undo: state.undo.slice(-30),
      elapsed: Math.max(0, Math.round(elapsed))
    };
    save(data);
  }
  function openGame(id, difficulty, seed, push) {
    stash();
    state.view = 'game';
    state.game = id;
    state.difficulty = difficulty;
    state.seed = seed;
    state.puzzle = null;
    state.play = null;
    state.undo = [];
    state.elapsed = 0;
    state.timing = false;
    state.solved = false;
    state.status = 'Setting the pieces…';
    const data = prefs();
    data.difficulty = data.difficulty || {};
    data.difficulty[id] = difficulty;
    save(data);
    const url = '#' + [id, difficulty, encodeURIComponent(seed)].join('/');
    if (push) history.pushState({ view: 'game' }, '', url);
    else history.replaceState({ view: 'game' }, '', url);
    render();
    setTimeout(function () {
      const engine = engines()[id];
      if (!engine) {
        state.status = 'That deal did not hold.';
        render();
        return;
      }
      try {
        state.puzzle = engine.generate(difficulty, seed);
        state.play = freshPlay(state.puzzle);
        state.walls = state.puzzle.game === 'zip' ? zipWalls(state.puzzle) : state.puzzle.game === 'wend' ? new Set(state.puzzle.walls.map(function (wall) { return wall[0] + ',' + wall[1]; })) : null;
        const resume = prefs().resume;
        if (resume && resume.game === id && resume.difficulty === difficulty && resume.seed === seed && resume.play) {
          state.play = resume.play;
          state.undo = Array.isArray(resume.undo) ? resume.undo : [];
          state.elapsed = resume.elapsed || 0;
          state.timing = false;
          startClock();
        }
        state.status = engine.tagline;
      } catch (err) {
        state.status = 'That deal did not hold.';
      }
      render();
    }, 20);
  }
  function showTable(push) {
    stash();
    state.view = 'table';
    state.round = null;
    state.summary = null;
    if (push) history.pushState({ view: 'table' }, '', location.pathname + location.search);
    render();
  }
  function onAct(act, node) {
    if (act === 'tonight') {
      state.round = { index: 0, times: [] };
      openGame('zip', 'easy', dailySeed('zip', 'easy'), true);
      return;
    }
    if (act === 'table') {
      showTable(true);
      return;
    }
    if (act === 'copy') {
      const done = function () { state.toast = 'Link copied.'; render(); setTimeout(function () { state.toast = ''; render(); }, 1400); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(location.href).then(done).catch(done);
      else done();
      return;
    }
    if (act === 'mistakes') {
      save({ mistakes: !mistakesOn() });
      render();
      return;
    }
    if (act === 'undo') {
      const prev = state.undo.pop();
      if (!prev) return;
      state.play = JSON.parse(prev);
      state.solved = false;
      state.timing = state.elapsed > 0;
      if (state.timing) state.started = performance.now() - state.elapsed;
      render();
      return;
    }
    if (act === 'hint') { hint(); return; }
    if (act === 'new') {
      const had = state.timing && !state.solved;
      state.round = null;
      if (had) state.toast = 'The last one is on the shelf.';
      openGame(state.game, state.difficulty, freshSeed(), false);
      if (had) setTimeout(function () {
        state.toast = '';
        const note = document.querySelector('.toast');
        if (note) note.remove();
      }, 2200);
      return;
    }
    if (act === 'another') {
      if (state.round) {
        state.round.times.push({ game: state.game, ms: state.elapsed });
        state.round.index += 1;
        if (state.round.index >= ORDER.length) {
          state.summary = state.round.times;
          state.view = 'summary';
          state.round = null;
          render();
          return;
        }
        const next = ORDER[state.round.index];
        const diff = next === 'sudoku' ? 'mini' : 'easy';
        openGame(next, diff, dailySeed(next, diff), false);
        return;
      }
      openGame(state.game, state.difficulty, freshSeed(), false);
      return;
    }
    if (act === 'guess') {
      if (!state.puzzle || state.puzzle.game !== 'pinpoint' || state.solved) return;
      const field = document.querySelector('[data-guess]');
      if (field) state.play.text = field.value;
      if (pinpointSolved()) {
        state.play.note = '';
        markSolved();
        render();
        return;
      }
      pushUndo();
      startClock();
      if (state.play.shown < state.puzzle.words.length) state.play.shown += 1;
      state.play.note = 'Not that. Another word is on the table.';
      render();
      const sheet = document.querySelector('.sheet');
      if (sheet) {
        sheet.classList.remove('shake');
        void sheet.offsetWidth;
        sheet.classList.add('shake');
      }
      const again = document.querySelector('[data-guess]');
      if (again) {
        again.focus();
        again.select();
      }
      return;
    }
    if ((act === 'up' || act === 'down') && state.play && state.puzzle && state.puzzle.game === 'crossclimb' && !state.solved) {
      const at = Number(node.getAttribute('data-at'));
      const to = act === 'up' ? at - 1 : at + 1;
      if (to < 0 || to >= state.play.order.length) return;
      pushUndo();
      const tmp = state.play.order[at];
      state.play.order[at] = state.play.order[to];
      state.play.order[to] = tmp;
      startClock();
      render();
      return;
    }
    if (act === 'pencil') {
      state.play.pencil = !state.play.pencil;
      render();
      return;
    }
    if (act === 'clear' && state.play.sel) {
      const r = state.play.sel[0];
      const c = state.play.sel[1];
      if (!state.puzzle.givens[r][c]) {
        pushUndo();
        state.play.values[r][c] = 0;
        state.play.notes[r][c] = 0;
        afterMove(false);
      }
    }
  }
  function onField(event) {
    if (!state.play || state.solved || !event.target || !event.target.getAttribute) return;
    const input = event.target;
    if (input.getAttribute('data-guess') != null) {
      state.play.text = input.value;
      return;
    }
    const rung = input.getAttribute('data-rung');
    if (rung != null && state.puzzle.game === 'crossclimb') {
      const clean = input.value.toLowerCase().replace(/[^a-z]/g, '').slice(0, state.puzzle.letters);
      if (clean !== input.value) input.value = clean;
      state.play.typed[Number(rung)] = clean;
      startClock();
      refreshCross();
      return;
    }
    const end = input.getAttribute('data-end');
    if (end && state.puzzle.game === 'crossclimb') {
      const clean = input.value.toLowerCase().replace(/[^a-z]/g, '').slice(0, state.puzzle.letters);
      if (clean !== input.value) input.value = clean;
      state.play[end] = clean;
      startClock();
      if (crossSolved()) {
        markSolved();
        render();
      } else refreshCross();
    }
  }
  function refreshCross() {
    const status = document.getElementById('status');
    if (status) status.textContent = statusLine();
    document.querySelectorAll('[data-rung]').forEach(function (input) {
      const rung = state.puzzle.rungs[Number(input.getAttribute('data-rung'))];
      input.parentElement.parentElement.classList.toggle('hit', input.value === rung.answer);
    });
    const open = crossEndsOpen();
    const ends = document.querySelector('.ends');
    if (open !== !!ends) render();
  }
  function boot() {
    if (boot.done) return;
    boot.done = true;
    const app = document.getElementById('app') || document.body.appendChild(Object.assign(document.createElement('div'), { id: 'app' }));
    document.addEventListener('pointerdown', onPointerDown, { passive: false });
    document.addEventListener('pointermove', onPointerMove);
    document.addEventListener('pointerup', onPointerUp);
    app.addEventListener('input', onField);
    app.addEventListener('click', function (event) {
      const fresh = event.target.closest('[data-fresh]');
      if (fresh) {
        const id = fresh.getAttribute('data-fresh');
        const data = prefs();
        if (data.resume && data.resume.game === id) {
          data.resume = null;
          save(data);
        }
        state.round = null;
        const stored = (prefs().difficulty || {})[id] || 'easy';
        openGame(id, stored, freshSeed(), true);
        return;
      }
      const game = event.target.closest('[data-game]');
      if (game) {
        const id = game.getAttribute('data-game');
        const resume = resumeOf();
        state.round = null;
        if (resume && resume.game === id) openGame(id, resume.difficulty, resume.seed, true);
        else openGame(id, (prefs().difficulty || {})[id] || 'easy', freshSeed(), true);
        return;
      }
      const person = event.target.closest('[data-person]');
      if (person && state.play) {
        state.play.selected = person.getAttribute('data-person');
        render();
        return;
      }
      const digit = event.target.closest('[data-digit]');
      if (digit) { onDigit(Number(digit.getAttribute('data-digit'))); return; }
      const diff = event.target.closest('[data-diff]');
      if (diff) {
        openGame(state.game, diff.getAttribute('data-diff'), state.seed, false);
        return;
      }
      const act = event.target.closest('[data-act]');
      if (act) onAct(act.getAttribute('data-act'), act);
    });
    document.addEventListener('keydown', function (event) {
      if (state.view !== 'game') return;
      const typing = event.target && (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA');
      if (typing) {
        if (event.key === 'Enter' && state.puzzle && state.puzzle.game === 'pinpoint') {
          event.preventDefault();
          onAct('guess');
        }
        return;
      }
      if (event.key === 'Escape') showTable(true);
      if (event.key === 'u' || event.key === 'U') onAct('undo');
      if (event.key === 'h' || event.key === 'H') onAct('hint');
      if (event.key === 'N' && event.shiftKey) onAct('new');
      if ((event.key === 'p' || event.key === 'P') && state.puzzle && state.puzzle.game === 'sudoku') onAct('pencil');
      if (state.puzzle && state.puzzle.game === 'sudoku' && /^[1-9]$/.test(event.key) && Number(event.key) <= state.puzzle.size) onDigit(Number(event.key));
      if (state.puzzle && state.puzzle.game === 'sudoku' && (event.key === 'Backspace' || event.key === 'Delete')) onAct('clear');
    });
    window.addEventListener('pagehide', stash);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') stash();
    });
    window.addEventListener('popstate', function () {
      const raw = location.hash.replace(/^#/, '');
      if (!raw) { showTable(false); return; }
      const parts = raw.split('/');
      const game = parts[0];
      const difficulty = parts[1];
      const seed = decodeURIComponent(parts.slice(2).join('/'));
      if (ORDER.indexOf(game) === -1 || !seed) { showTable(false); return; }
      openGame(game, difficulty, seed, false);
    });
    const raw = location.hash.replace(/^#/, '');
    if (!raw) render();
    else {
      const parts = raw.split('/');
      if (ORDER.indexOf(parts[0]) !== -1 && parts[2]) openGame(parts[0], parts[1], decodeURIComponent(parts.slice(2).join('/')), false);
      else render();
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
